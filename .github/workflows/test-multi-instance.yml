# =============================================================================
# Multi-instance test: the central idea of this project.
#
# Instead of one container per game server, we run SEVERAL game servers inside
# ONE container, sharing one Wine environment and one fake screen.
#
# - Runs only when you click "Run workflow" in the Actions tab.
# - Nothing is published anywhere.
#
# What it proves:
#   1. Three servers (Rush, Conquest, Squad Deathmatch) start side by side in
#      one container.
#   2. Each one opens its own RCON port. The Conquest server uses
#      127.0.0.1:48889 (localhost only), which is how we want to run in the
#      final version. The other two use 0.0.0.0 (the known-good format).
#   3. We can log in over RCON to all three.
#   4. All three log in to the master server.
#   5. How much memory and CPU the whole thing needs (docker stats).
# =============================================================================
name: test-multi-instance

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA256 of src_v09.rar (master server source code).
  SRC_SHA256: "a3e180526ac71af639e73c5ee33ea98c55ddae48d0e81aea2621070b0272031c"
  # SHA256 of Bc2emu_V09.rar (the server pack).
  PACK_SHA256: "d1b25860f23af15cbab6549d41840836056ab38a49357eb3064a7d00f6d9f04b"

jobs:
  multi:
    # Native amd64 runner. Wine + the 32-bit game server are amd64 only.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out this repo
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # "load: true" keeps the image on the runner so we can test it.
      # "push: false" means it is NOT uploaded to any registry.
      - name: Build the master image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: ./master
          load: true
          push: false
          tags: bfbc2-master:test
          build-args: |
            SRC_SHA256=${{ env.SRC_SHA256 }}
          cache-from: type=gha,scope=master
          cache-to: type=gha,scope=master,mode=max

      - name: Build the game image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: ./game
          load: true
          push: false
          tags: bfbc2-game:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Fetch the server pack
        run: |
          mkdir -p data
          chmod 777 data
          docker run --rm --user 1000:1000 \
            -v "$PWD/data:/data" \
            -e PACK_SHA256="${PACK_SHA256}" \
            bfbc2-game:test fetch-pack

      # The pack files belong to user 1000, so we edit them with sudo.
      - name: Prepare settings
        run: |
          # Master: also write a log FILE (its console output is buffered and
          # arrives late, but the log file is complete).
          sudo sed -i \
            -e 's/^log_create = false/log_create = true/' \
            -e 's/^console_log_level = 1/console_log_level = 2/' \
            data/pack/MasterServerEmu/config.ini
          grep -E '^(emulator_ip|log_create|console_log_level)' data/pack/MasterServerEmu/config.ini

          # Game servers: unique game port, RCON in "ip:port" format, and the
          # same RCON password everywhere.
          prep() {
            sudo sed -i \
              -e "s/^Port=.*/Port=$2/" \
              -e "s/^RemoteAdminPort=.*/RemoteAdminPort=$3/" \
              -e "s/^RemoteAdminPassword=.*/RemoteAdminPassword=123456/" \
              "data/pack/$1/ServerOptions.ini"
            echo "--------- $1/ServerOptions.ini"
            cat "data/pack/$1/ServerOptions.ini"; echo
          }
          prep Instance      19567 0.0.0.0:48888
          prep Instance_conq 19568 127.0.0.1:48889
          prep Instance_sqdm 19569 0.0.0.0:48890

      - name: Start the master server
        run: |
          docker run -d -t --init --name bc2-master --net=host --user 1000:1000 \
            -v "$PWD/data/pack/MasterServerEmu:/work" -w /work \
            bfbc2-master:test /opt/mase/mase_bc2
          sleep 5
          if ! docker ps -q -f name=bc2-master | grep -q .; then
            echo "The master exited right after starting:"
            docker logs bc2-master 2>&1 | tail -n 50
            exit 1
          fi

      # This small script is the seed of the real supervisor: ONE fake screen,
      # then several servers, all in the same container and the same Wine
      # environment. (Because it is not xvfb-run, the "PID 1" problem from the
      # first tests does not apply. Docker --init is used anyway.)
      - name: Write the multi-server script
        run: |
          cat > data/run-instances.sh <<'EOF'
          #!/bin/bash
          # One fake screen, shared by every server.
          Xvfb :99 -nolisten tcp -screen 0 1280x1024x24 &
          export DISPLAY=:99
          sleep 2

          cd /data/pack
          for inst in Instance Instance_conq Instance_sqdm; do
            echo "starting ${inst}"
            wine Frost.Game.Main_Win32_Final.exe \
              -serverInstancePath "${inst}/" \
              -mapPack2Enabled 1 \
              -timeStampLogNames \
              -region OC \
              -heartBeatInterval 20000 &
            # The original launcher also waits between servers.
            sleep 2
          done

          # Keep the container alive as long as any server runs.
          wait
          EOF
          chmod 755 data/run-instances.sh

      - name: Start all three game servers in ONE container
        run: |
          docker run -d --init --name bc2-game --net=host --user 1000:1000 \
            -e WINEDEBUG=err+all,fixme-all \
            -v "$PWD/data:/data" \
            bfbc2-game:test \
            bash /data/run-instances.sh

      - name: Wait for the three RCON ports
        run: |
          probe() { (echo > /dev/tcp/127.0.0.1/"$1") 2>/dev/null && echo yes || echo no; }
          for i in $(seq 1 60); do
            a=$(probe 48888); b=$(probe 48889); c=$(probe 48890)
            if [ "$a" = yes ] && [ "$b" = yes ] && [ "$c" = yes ]; then
              echo "All three RCON ports are open (after about $((i*2)) seconds)"
              exit 0
            fi
            sleep 2
          done
          echo "Not all RCON ports opened within 2 minutes:"
          echo "  Instance      0.0.0.0:48888   open = $(probe 48888)"
          echo "  Instance_conq 127.0.0.1:48889 open = $(probe 48889)"
          echo "  Instance_sqdm 0.0.0.0:48890   open = $(probe 48890)"
          exit 1

      # Our own small RCON client (first draft of what the web UI will use).
      - name: RCON login and server info (all three)
        run: |
          python3 - <<'PY'
          import hashlib, socket, struct, time

          HOST, PASSWORD = "127.0.0.1", "123456"
          SERVERS = [("Instance", 48888), ("Instance_conq", 48889), ("Instance_sqdm", 48890)]

          def encode(seq, words):
              body = b"".join(struct.pack("<I", len(w)) + w.encode() + b"\x00" for w in words)
              return struct.pack("<III", seq & 0x3FFFFFFF, 12 + len(body), len(words)) + body

          def decode(packet):
              _, _, count = struct.unpack("<III", packet[:12])
              words, off = [], 12
              for _ in range(count):
                  (n,) = struct.unpack("<I", packet[off:off + 4])
                  words.append(packet[off + 4:off + 4 + n].decode(errors="replace"))
                  off += n + 5
              return words

          def read_packet(sock):
              buf = b""
              while len(buf) < 8:
                  chunk = sock.recv(4096)
                  if not chunk:
                      raise RuntimeError("connection closed")
                  buf += chunk
              size = struct.unpack("<I", buf[4:8])[0]
              while len(buf) < size:
                  chunk = sock.recv(4096)
                  if not chunk:
                      raise RuntimeError("connection closed")
                  buf += chunk
              return decode(buf[:size])

          class Rcon:
              def __init__(self, port):
                  self.seq = 0
                  self.sock = socket.create_connection((HOST, port), timeout=10)

              def call(self, *words):
                  self.sock.sendall(encode(self.seq, list(words)))
                  self.seq += 1
                  return read_packet(self.sock)

          failed = False
          for name, port in SERVERS:
              print("=====", name, "port", port)
              for attempt in range(5):
                  try:
                      rcon = Rcon(port)
                      salt = rcon.call("login.hashed")
                      digest = hashlib.md5(bytes.fromhex(salt[1]) + PASSWORD.encode()).hexdigest().upper()
                      print("login:        ", rcon.call("login.hashed", digest))
                      print("serverInfo:   ", rcon.call("serverInfo"))
                      print("currentLevel: ", rcon.call("admin.currentLevel"))
                      print("listPlayers:  ", rcon.call("admin.listPlayers", "all"))
                      break
                  except Exception as err:
                      print("attempt", attempt + 1, "failed:", err)
                      time.sleep(3)
              else:
                  failed = True
          if failed:
              raise SystemExit("RCON login failed on at least one server")
          PY

      # Give the servers time to send heartbeats to the master.
      - name: Wait for the heartbeats
        run: sleep 30

      # Always print what matters, pass or fail.
      - name: Diagnostics
        if: always()
        run: |
          echo "=================== resource use (whole game container and master)"
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' || true

          echo "=================== processes in the game container (rss = memory in KB)"
          docker top bc2-game -eo pid,rss,pcpu,etime,args || true

          echo "=================== did every server come up? (from their own logs)"
          grep -H -E "Remote Administration interface|accepting players" \
            data/pack/Instance*/RuntimeLog_* 2>/dev/null | sed 's/\[UTC [^]]*\] //' || true

          echo "=================== master log file(s), last 120 lines"
          found=no
          for f in $(find data/pack/MasterServerEmu -maxdepth 1 -type f -newer data/pack/.pack-sha256 ! -name config.ini); do
            found=yes
            echo "--- ${f}"
            tail -n 120 "${f}"
          done
          [ "${found}" = yes ] || echo "(no master log file found)"

          echo "=================== master console output (last 20 lines)"
          docker logs --tail 20 bc2-master 2>&1 || true

          echo "=================== game container output (last 30 lines)"
          docker logs --tail 30 bc2-game 2>&1 || true
