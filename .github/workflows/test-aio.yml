# =============================================================================
# Test of the all-in-one image, configured ONLY through environment variables.
#
# - Runs only when you click "Run workflow" in the Actions tab.
# - Nothing is published anywhere.
#
# What it proves:
#   1. The image builds from the repo's root Dockerfile.
#   2. On first start it downloads and verifies the server pack by itself.
#   3. Three game servers (Rush, Squad Deathmatch, Vietnam Rush) come up from
#      environment variables alone, and the values arrive in the real
#      servers (checked over RCON): names, passwords, hardcore, custom vars,
#      the Vietnam map list.
#   4. PUID / PGID / TZ work: processes and files belong to the chosen IDs.
#   5. All three servers register with the built-in master.
#   6. A restart is fast (clean shutdown) and does not download the pack again.
# =============================================================================
name: test-aio

on:
  workflow_dispatch:
  # Lets publish.yml run this whole test first and refuse to publish if it fails.
  workflow_call:

permissions:
  contents: read

jobs:
  aio:
    # Native amd64 runner. Wine + the 32-bit game server are amd64 only.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out this repo
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # "load: true" keeps the image on the runner so we can test it.
      # "push: false" means it is NOT uploaded to any registry.
      - name: Build the image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          load: true
          push: false
          tags: bfbc2-aio:test
          cache-from: type=gha,scope=aio
          cache-to: type=gha,scope=aio,mode=max

      # How big is the image? (Compressed download size is a bit smaller.)
      - name: Show the image size
        run: |
          docker image ls bfbc2-aio:test --format 'image size on disk: {{.Size}}'
          echo "--------- biggest layers"
          docker history bfbc2-aio:test --format '{{.Size}}\t{{.CreatedBy}}' | sort -hr | head -6 | cut -c1-110

      # Everything below is configured with environment variables, exactly
      # like a Compose file would do. /data starts empty.
      - name: Start the container
        run: |
          mkdir -p data
          docker run -d --name aio --network host \
            -e PUID=1234 -e PGID=1234 -e TZ=Africa/Cairo \
            -e MASTER_FILE_LOG_LEVEL=3 \
            -e MASTER_ALL_STATS_UNLOCKED=true \
            -e WEB_PASSWORD=webpass123 \
            -e SERVER_RCON_PASSWORD=testpass123 \
            -e SERVER_MAX_PLAYERS=24 \
            -e SERVER_1_TYPE=rush \
            -e SERVER_1_NAME="Test Rush" \
            -e SERVER_1_GAME_PASSWORD=abc123 \
            -e SERVER_1_RANKED=false \
            -e SERVER_1_DESCRIPTION=$'Hello\nWorld' \
            -e SERVER_2_TYPE=sqdm \
            -e SERVER_2_NAME="Test SQDM" \
            -e SERVER_2_HARDCORE=true \
            -e SERVER_2_VAR_idleTimeout=123 \
            -e SERVER_2_MAX_PLAYERS=16 \
            -e SERVER_3_TYPE=vietrush \
            -e SERVER_3_NAME="Test Vietnam Rush" \
            -v "$PWD/data:/data" \
            bfbc2-aio:test

      # The first start downloads the 437 MB server pack, so this can take a
      # few minutes. We wait up to 8 minutes for all three RCON ports.
      - name: Wait for the three servers
        run: |
          probe() { (echo > /dev/tcp/127.0.0.1/"$1") 2>/dev/null && echo yes || echo no; }
          for i in $(seq 1 240); do
            if ! docker ps -q -f name=aio | grep -q .; then
              echo "The container stopped:"; docker logs aio 2>&1 | tail -n 40; exit 1
            fi
            if [ "$(probe 48888)" = yes ] && [ "$(probe 48889)" = yes ] && [ "$(probe 48890)" = yes ]; then
              echo "All three RCON ports are open (after about $((i*2)) seconds)"
              exit 0
            fi
            sleep 2
          done
          echo "Not all servers came up in 8 minutes:"
          docker logs aio 2>&1 | tail -n 40
          exit 1

      # Ask the running servers what settings they really have.
      - name: Check the settings inside the servers (RCON)
        id: rconcheck
        # The job continues even if a check fails, so the later checks still
        # run. The last step of the job reports the RCON verdict.
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import hashlib, socket, struct, sys, time, traceback

          HOST, PASSWORD = "127.0.0.1", "testpass123"

          def encode(seq, words):
              body = b"".join(struct.pack("<I", len(w)) + w.encode() + b"\x00" for w in words)
              return struct.pack("<III", seq & 0x3FFFFFFF, 12 + len(body), len(words)) + body

          def decode(packet):
              _, _, count = struct.unpack("<III", packet[:12])
              words, off = [], 12
              for _ in range(count):
                  (n,) = struct.unpack("<I", packet[off:off + 4])
                  words.append(packet[off + 4:off + 4 + n].decode(errors="replace"))
                  off += n + 5
              return words

          def read_packet(sock):
              buf = b""
              while len(buf) < 8:
                  chunk = sock.recv(4096)
                  if not chunk:
                      raise RuntimeError("connection closed")
                  buf += chunk
              size = struct.unpack("<I", buf[4:8])[0]
              while len(buf) < size:
                  chunk = sock.recv(4096)
                  if not chunk:
                      raise RuntimeError("connection closed")
                  buf += chunk
              return decode(buf[:size])

          class Rcon:
              def __init__(self, port):
                  self.seq = 0
                  self.sock = socket.create_connection((HOST, port), timeout=10)
                  salt = self.call("login.hashed")
                  digest = hashlib.md5(bytes.fromhex(salt[1]) + PASSWORD.encode()).hexdigest().upper()
                  reply = self.call("login.hashed", digest)
                  if reply[0] != "OK":
                      raise RuntimeError("login failed: %r" % reply)

              def call(self, *words):
                  self.sock.sendall(encode(self.seq, list(words)))
                  self.seq += 1
                  return read_packet(self.sock)

              def get(self, *words):
                  reply = self.call(*words)
                  return reply[1] if len(reply) > 1 else ""

          failures = []

          def check(label, actual, test, expected_text):
              ok = test(actual)
              print(("PASS  " if ok else "FAIL  ") + "%-40s got %r (expected %s)" % (label, actual, expected_text))
              if not ok:
                  failures.append(label)

          def check_soon(label, getter, test, expected_text, seconds=20):
              # Settings from the startup script may be applied a few seconds
              # after the server starts accepting connections. Give them time.
              deadline = time.time() + seconds
              while True:
                  actual = getter()
                  if test(actual) or time.time() > deadline:
                      break
                  time.sleep(2)
              check(label, actual, test, expected_text)

          def has_password_now(rcon):
              inf = rcon.call("serverInfo")
              return inf[inf.index("AcceptingPlayers") + 3]

          def wait_ready(rcon, seconds=90):
              # The RCON port opens before the server is fully up.
              deadline = time.time() + seconds
              info = []
              while time.time() < deadline:
                  info = rcon.call("serverInfo")
                  if "AcceptingPlayers" in info:
                      return info
                  time.sleep(2)
              raise RuntimeError("never reached AcceptingPlayers; last serverInfo: %r" % (info,))

          for name, port in [("server 1 (rush)", 48888), ("server 2 (sqdm)", 48889), ("server 3 (vietrush)", 48890)]:
              print("=====", name, "RCON port", port)
              try:
                  for attempt in range(5):
                      try:
                          rcon = Rcon(port)
                          break
                      except Exception as err:
                          print("  login attempt", attempt + 1, "failed:", err)
                          time.sleep(3)
                  else:
                      raise RuntimeError("could not log in over RCON")

                  info = wait_ready(rcon)
                  print("  serverInfo:", info)
                  i = info.index("AcceptingPlayers")
                  ranked, has_password = info[i + 1], info[i + 3]

                  if port == 48888:
                      check("name",          rcon.get("vars.serverName"),        lambda v: v == "Test Rush", "Test Rush")
                      check("max players",   info[3],                            lambda v: v == "24", "24 (global SERVER_MAX_PLAYERS)")
                      check("ranked",        ranked,                             lambda v: v == "false", "false (SERVER_1_RANKED)")
                      check_soon("game password", lambda: rcon.get("vars.gamePassword"), lambda v: v == "abc123", "abc123")
                      check_soon("has password",  lambda: has_password_now(rcon), lambda v: v == "true", "true")
                      check_soon("description",   lambda: rcon.get("vars.serverDescription"), lambda v: "Hello" in v and "World" in v, "contains Hello and World")
                      check("first map",     rcon.get("admin.currentLevel").lower(), lambda v: v.startswith("levels/mp_002"), "levels/mp_002")
                  elif port == 48889:
                      check("name",          rcon.get("vars.serverName"),        lambda v: v == "Test SQDM", "Test SQDM")
                      check("max players",   info[3],                            lambda v: v == "16", "16 (SERVER_2_MAX_PLAYERS beats the global 24)")
                      check_soon("hardcore",     lambda: rcon.get("vars.hardCore"),    lambda v: v == "true", "true")
                      check_soon("idleTimeout",  lambda: rcon.get("vars.idleTimeout"), lambda v: v == "123", "123 (from SERVER_2_VAR_idleTimeout)")
                      # Exploration, not a pass/fail check: can a game password be set at
                      # run time on this RANKED server?
                      print("  [explore] ranked =", ranked, "| has password before:", has_password)
                      print("  [explore] set password:", rcon.call("vars.gamePassword", "zzz999"))
                      print("  [explore] read back:   ", rcon.call("vars.gamePassword"))
                      print("  [explore] has password after:", has_password_now(rcon))
                  else:
                      check("name",          rcon.get("vars.serverName"),        lambda v: v == "Test Vietnam Rush", "Test Vietnam Rush")
                      check("max players",   info[3],                            lambda v: v == "24", "24 (global SERVER_MAX_PLAYERS)")
                      check("first map",     rcon.get("admin.currentLevel").lower(), lambda v: "nam_mp" in v, "a Vietnam map (nam_mp...)")
                      check("game mod",      "VIETNAM" if "VIETNAM" in info else "BC2", lambda v: v == "VIETNAM", "VIETNAM")
              except Exception:
                  # A crash in the test itself must show up as a clear FAIL, not a wall of text.
                  print("FAIL  %s: the check could not finish:" % name)
                  traceback.print_exc(file=sys.stdout)
                  failures.append(name)

          print()
          if failures:
              raise SystemExit("FAILED checks: " + ", ".join(failures))
          print("All settings arrived in the servers.")
          PY

      # Give the servers time to send heartbeats to the master.
      - name: Wait for the heartbeats
        run: sleep 30

      # The web interface: login is required, it sees all three servers, and a
      # command sent through it reaches a real game server.
      - name: Check the web interface
        run: |
          fail=0
          U=http://127.0.0.1:5010
          echo "--------- health check needs no login"
          [ "$(curl -s -o /dev/null -w '%{http_code}' $U/healthz)" = 200 ] && echo PASS || { echo FAIL; fail=1; }
          echo "--------- no password: refused"
          [ "$(curl -s -o /dev/null -w '%{http_code}' $U/api/servers)" = 401 ] && echo PASS || { echo FAIL; fail=1; }
          echo "--------- wrong password: refused"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -u admin:nope $U/api/servers)" = 401 ] && echo PASS || { echo FAIL; fail=1; }
          echo "--------- the page is served"
          curl -s -u admin:webpass123 $U/ | grep -q "BFBC2 Server Manager" && echo PASS || { echo FAIL; fail=1; }
          echo "--------- the API sees all three servers online, by name"
          curl -s -u admin:webpass123 $U/api/servers | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          names = [(s['info'] or {}).get('name') for s in d]
          print(names, [s['online'] for s in d])
          sys.exit(0 if len(d) == 3 and all(s['online'] for s in d) and names == ['Test Rush', 'Test SQDM', 'Test Vietnam Rush'] else 1)
          " && echo PASS || { echo FAIL; fail=1; }
          echo "--------- a command sent through the web interface reaches server 2"
          curl -s -u admin:webpass123 -H 'Content-Type: application/json' -d '{"command":"vars.serverName"}' $U/api/servers/2/console | grep -q "Test SQDM" && echo PASS || { echo FAIL; fail=1; }
          echo "--------- map pictures are off by default: nothing is downloaded"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -u admin:webpass123 $U/maps/mp_002.jpg)" = 404 ] \
            && curl -s -u admin:webpass123 $U/api/status | grep -q '"mapImages":false' && echo PASS || { echo FAIL; fail=1; }
          echo "--------- status checks must not make the master log connection errors"
          for i in 1 2 3; do curl -s -o /dev/null -u admin:webpass123 $U/api/status; done
          sleep 2
          if grep -q "handle_handshake" data/master/logfile.log; then echo "FAIL: the master logged handshake errors"; fail=1; else echo PASS; fi
          echo "--------- a cross-site style request (form data) is refused"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -u admin:webpass123 -d 'x=1' $U/api/servers/2/console)" = 415 ] && echo PASS || { echo FAIL; fail=1; }
          echo "--------- stop server 3 from the web interface: its RCON port closes and its state says stopped"
          curl -s -u admin:webpass123 -H 'Content-Type: application/json' -d '{"action":"stop"}' $U/api/servers/3/power | grep -q '"ok":true' || { echo "FAIL: stop was refused"; fail=1; }
          closed=no
          for i in $(seq 1 20); do
            if ! (echo > /dev/tcp/127.0.0.1/48890) 2>/dev/null; then closed=yes; break; fi
            sleep 1
          done
          [ "${closed}" = yes ] && echo "PASS: the port closed" || { echo "FAIL: the server did not stop"; fail=1; }
          stopped=no
          for i in $(seq 1 20); do
            if curl -s -u admin:webpass123 $U/api/servers | grep -q '"state":"stopped"'; then stopped=yes; break; fi
            sleep 1
          done
          [ "${stopped}" = yes ] && echo "PASS: state is stopped" || { echo "FAIL: state never became stopped"; fail=1; }
          echo "--------- start it again: its RCON port opens"
          curl -s -u admin:webpass123 -H 'Content-Type: application/json' -d '{"action":"start"}' $U/api/servers/3/power | grep -q '"ok":true' || { echo "FAIL: start was refused"; fail=1; }
          opened=no
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/48890) 2>/dev/null; then opened=yes; break; fi
            sleep 2
          done
          [ "${opened}" = yes ] && echo "PASS: it is running again" || { echo "FAIL: the server did not start again"; fail=1; }
          if [ "${fail}" != 0 ]; then
            echo "--------- diagnostics: control files inside the container"
            docker exec aio sh -c 'for f in /tmp/bfbc2-control/*; do echo "$f: $(cat "$f")"; done' || true
            echo "--------- diagnostics: game server processes (real, matched by command line)"
            docker top aio -eo pid,stat,args | grep -E "Frost|bfbc2-webui" | cut -c1-160 || true
            echo "--------- diagnostics: does the marker for server 3 match anything?"
            docker exec aio sh -c "pgrep -af 'serverInstancePath instances/3/ '" || echo "(no match)"
            echo "--------- diagnostics: last container messages"
            docker logs --tail 15 aio 2>&1 | cut -c1-200
          fi
          exit "${fail}"

      - name: Check users, time zone, files and master registration
        run: |
          fail=0
          echo "--------- processes (uid shown)"
          docker top aio -eo uid,pid,args | grep -E "Frost|mase_bc2|Xvfb" || true

          echo "--------- game servers run as user 1234?"
          bad=$(docker top aio -eo uid,args | grep "Frost.Game" | awk '$1 != 1234' | wc -l)
          [ "${bad}" = 0 ] && echo "PASS" || { echo "FAIL: ${bad} game server(s) run as another user"; fail=1; }

          echo "--------- time zone inside the container (Africa/Cairo is +0200 or +0300)"
          docker exec aio date +"%Z %z"

          echo "--------- file owners (expect 1234:1234)"
          stat -c '%u:%g  %n' data data/pack/.pack-sha256 data/instances/1/ServerOptions.ini data/master/config.ini
          owners=$(stat -c '%u:%g' data data/pack/.pack-sha256 data/instances/1/ServerOptions.ini data/master/config.ini | sort -u)
          [ "${owners}" = "1234:1234" ] && echo "PASS" || { echo "FAIL: unexpected owners"; fail=1; }

          echo "--------- master config got MASTER_ALL_STATS_UNLOCKED?"
          grep -E '^(all_stats_unlocked|log_create|emulator_ip)' data/master/config.ini
          grep -q '^all_stats_unlocked = true' data/master/config.ini && echo "PASS" || { echo "FAIL"; fail=1; }

          echo "--------- MASTER_EMULATOR_IP was not set: was a real address detected (not 0.0.0.0)?"
          if grep -qE '^emulator_ip = (0\.0\.0\.0|127\.0\.0\.1)' data/master/config.ini; then
            echo "FAIL: emulator_ip is 0.0.0.0 or 127.0.0.1"; fail=1
          else
            echo "PASS"
          fi

          echo "--------- master log file shown in docker logs?"
          docker logs aio 2>&1 | grep -c "\[Server\]" || true

          echo "--------- servers registered with the master (from its log file)"
          count=$(grep -rIh "Server was added to database" data/master 2>/dev/null | wc -l)
          echo "registrations: ${count}"
          [ "${count}" -ge 3 ] && echo "PASS" || { echo "FAIL: expected at least 3"; fail=1; }

          exit "${fail}"

      # A clean stop should take a few seconds, not the full 10-second
      # timeout after which Docker kills the container. The pack must not be
      # downloaded again.
      - name: Restart test
        run: |
          start=$(date +%s)
          docker restart aio
          end=$(date +%s)
          echo "restart took $((end-start)) seconds"
          if [ $((end-start)) -ge 10 ]; then
            echo "WARNING: the container had to be killed (no clean shutdown)"
          fi

          probe() { (echo > /dev/tcp/127.0.0.1/"$1") 2>/dev/null && echo yes || echo no; }
          for i in $(seq 1 90); do
            if [ "$(probe 48888)" = yes ] && [ "$(probe 48889)" = yes ] && [ "$(probe 48890)" = yes ]; then
              echo "All three RCON ports are open again (after about $((i*2)) seconds)"
              break
            fi
            sleep 2
            [ "$i" = 90 ] && { echo "Servers did not come back"; exit 1; }
          done

          echo "--------- did it skip the download?"
          docker logs aio 2>&1 | grep -c "pack already present" | grep -qv '^0$' \
            && echo "PASS" || { echo "FAIL: no 'pack already present' message"; exit 1; }

      # Always print what matters, pass or fail.
      - name: Diagnostics
        if: always()
        run: |
          echo "=================== container output (last 60 lines)"
          docker logs --tail 60 aio 2>&1 || true

          echo "=================== inside the container: user and /tmp"
          docker exec aio id || true
          docker exec aio ls -la /tmp || true

          echo "=================== resource use"
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}' aio || true

          echo "=================== generated: server 1 ServerOptions.ini and Startup.txt"
          cat data/instances/1/ServerOptions.ini 2>/dev/null || true
          echo "---"; cat data/instances/1/AdminScripts/Startup.txt 2>/dev/null || true

          echo "=================== generated: server 3 (Vietnam) map list"
          cat data/instances/3/maplist.txt 2>/dev/null || true

          echo "=================== master log file (last 12 lines, cut to 200 characters)"
          for f in $(find data/master -maxdepth 1 -type f ! -name config.ini | head -3); do
            echo "--- ${f}"; tail -n 12 "${f}" | cut -c1-200
          done

      # The RCON step above is allowed to fail without stopping the other
      # checks. This last step makes the whole job fail if it did.
      - name: Final verdict
        if: always()
        run: |
          if [ "${{ steps.rconcheck.outcome }}" = "failure" ]; then
            echo "The RCON settings check FAILED (see that step above)."
            exit 1
          fi
          echo "All checks passed."
