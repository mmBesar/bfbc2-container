# =============================================================================
# Integration test: master server + one game server, working together.
#
# - Runs only when you click "Run workflow" in the Actions tab.
# - Nothing is published anywhere.
#
# What it proves, step by step:
#   1. Both images build (master from source, game server under Wine).
#   2. The server pack downloads, passes its SHA256 check and unpacks.
#   3. The master server starts with the pack's own config and templates.
#   4. A game server starts and its RCON (remote admin) port opens.
#   5. We can log in over RCON and ask the server for its info. This also
#      tests our understanding of the RCON protocol, which the web UI needs.
#   6. The master's log and the server's log show whether the server
#      registered with the master.
#
# Findings from earlier tests that this file applies:
#   - RCON needs the "ip:port" format (a bare port does not open).
#   - xvfb-run must not be PID 1 in the container (docker --init fixes it).
# =============================================================================
name: test-integration

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA256 of src_v09.rar (master server source code).
  SRC_SHA256: "a3e180526ac71af639e73c5ee33ea98c55ddae48d0e81aea2621070b0272031c"
  # SHA256 of Bc2emu_V09.rar (the server pack).
  PACK_SHA256: "d1b25860f23af15cbab6549d41840836056ab38a49357eb3064a7d00f6d9f04b"

jobs:
  integration:
    # Native amd64 runner. Wine + the 32-bit game server are amd64 only.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out this repo
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # "load: true" keeps the image on the runner so we can test it.
      # "push: false" means it is NOT uploaded to any registry.
      - name: Build the master image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: ./master
          load: true
          push: false
          tags: bfbc2-master:test
          build-args: |
            SRC_SHA256=${{ env.SRC_SHA256 }}
          cache-from: type=gha,scope=master
          cache-to: type=gha,scope=master,mode=max

      # Same cache as the earlier game test, so this should be quick.
      - name: Build the game image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: ./game
          load: true
          push: false
          tags: bfbc2-game:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Downloads, verifies and unpacks the server pack into ./data/pack.
      - name: Fetch the server pack
        run: |
          mkdir -p data
          chmod 777 data
          docker run --rm --user 1000:1000 \
            -v "$PWD/data:/data" \
            -e PACK_SHA256="${PACK_SHA256}" \
            bfbc2-game:test fetch-pack

      # The pack files belong to user 1000, so we edit them with sudo.
      - name: Prepare settings
        run: |
          # Master: show a bit more detail in its log (level 1 -> 2).
          sudo sed -i 's/^console_log_level = 1/console_log_level = 2/' \
            data/pack/MasterServerEmu/config.ini
          grep -E '^(emulator_ip|console_log_level)' data/pack/MasterServerEmu/config.ini

          # Game server: RCON needs the "ip:port" format.
          sudo sed -i 's/^RemoteAdminPort=.*/RemoteAdminPort=0.0.0.0:48888/' \
            data/pack/Instance/ServerOptions.ini
          echo "--------- Instance/ServerOptions.ini"
          cat data/pack/Instance/ServerOptions.ini; echo

      # The master runs inside MasterServerEmu/ (it looks for config.ini,
      # templates/ and database/ in its current folder).
      # "-t" gives it a terminal so its log lines appear immediately.
      - name: Start the master server
        run: |
          docker run -d -t --init --name bc2-master --net=host --user 1000:1000 \
            -v "$PWD/data/pack/MasterServerEmu:/work" -w /work \
            bfbc2-master:test /opt/mase/mase_bc2
          # The original launcher waits 3 seconds after the master. We wait 5.
          sleep 5
          if ! docker ps -q -f name=bc2-master | grep -q .; then
            echo "The master exited right after starting:"
            docker logs bc2-master 2>&1 | tail -n 50
            exit 1
          fi
          echo "--------- master output so far"
          docker logs bc2-master 2>&1 | tail -n 30

      # Same launch command as the original "Start ALL 8 Server.bat".
      # "--init" keeps xvfb-run away from PID 1 (see the note at the top).
      - name: Start the game server
        run: |
          docker run -d --init --name bc2-game --net=host --user 1000:1000 \
            -e WINEDEBUG=err+all,fixme-all \
            -v "$PWD/data:/data" -w /data/pack \
            bfbc2-game:test \
            xvfb-run -e /dev/stdout -a -s "-nolisten tcp -screen 0 1280x1024x24" \
            wine Frost.Game.Main_Win32_Final.exe \
              -serverInstancePath Instance/ \
              -mapPack2Enabled 1 \
              -timeStampLogNames \
              -region OC \
              -heartBeatInterval 20000

      - name: Wait for the RCON port
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/48888) 2>/dev/null; then
              echo "RCON port 48888 is open (after about $((i*2)) seconds)"
              exit 0
            fi
            sleep 2
          done
          echo "The RCON port never opened"
          exit 1

      # A tiny RCON client, written from scratch, as a first draft of what the
      # web UI will need. Steps: connect, ask for a salt, send the hashed
      # password, then ask for server info and the player list.
      - name: RCON login and server info
        run: |
          python3 - <<'PY'
          import hashlib, socket, struct, time

          HOST, PORT, PASSWORD = "127.0.0.1", 48888, "123456"

          def encode(seq, words):
              body = b"".join(struct.pack("<I", len(w)) + w.encode() + b"\x00" for w in words)
              return struct.pack("<III", seq & 0x3FFFFFFF, 12 + len(body), len(words)) + body

          def decode(packet):
              _, _, count = struct.unpack("<III", packet[:12])
              words, off = [], 12
              for _ in range(count):
                  (n,) = struct.unpack("<I", packet[off:off + 4])
                  words.append(packet[off + 4:off + 4 + n].decode(errors="replace"))
                  off += n + 5
              return words

          def read_packet(sock):
              buf = b""
              while len(buf) < 8:
                  chunk = sock.recv(4096)
                  if not chunk:
                      raise RuntimeError("connection closed")
                  buf += chunk
              size = struct.unpack("<I", buf[4:8])[0]
              while len(buf) < size:
                  chunk = sock.recv(4096)
                  if not chunk:
                      raise RuntimeError("connection closed")
                  buf += chunk
              return decode(buf[:size])

          class Rcon:
              def __init__(self):
                  self.seq = 0
                  self.sock = socket.create_connection((HOST, PORT), timeout=10)

              def call(self, *words):
                  self.sock.sendall(encode(self.seq, list(words)))
                  self.seq += 1
                  return read_packet(self.sock)

          # The server may need a moment after opening the port.
          for attempt in range(5):
              try:
                  rcon = Rcon()
                  salt = rcon.call("login.hashed")
                  print("salt reply:", salt)
                  digest = hashlib.md5(bytes.fromhex(salt[1]) + PASSWORD.encode()).hexdigest().upper()
                  print("login reply:", rcon.call("login.hashed", digest))
                  break
              except Exception as err:
                  print("attempt", attempt + 1, "failed:", err)
                  time.sleep(3)
          else:
              raise SystemExit("could not log in over RCON")

          print("version:       ", rcon.call("version"))
          print("serverInfo:    ", rcon.call("serverInfo"))
          print("listPlayers:   ", rcon.call("admin.listPlayers", "all"))
          print("currentLevel:  ", rcon.call("admin.currentLevel"))
          PY

      # Give the server time to send a heartbeat to the master (20 seconds).
      - name: Wait for the heartbeat
        run: sleep 30

      # Always print what everyone said, pass or fail.
      - name: Diagnostics
        if: always()
        run: |
          echo "=================== master: state and processes"
          docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' bc2-master || true
          docker top bc2-master -eo pid,stat,pcpu,etime,args || true
          echo "=================== master output (last 120 lines)"
          docker logs --tail 120 bc2-master 2>&1 || true

          echo "=================== game server: state and processes"
          docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' bc2-game || true
          docker top bc2-game -eo pid,stat,pcpu,etime,args || true
          echo "=================== game server output (last 60 lines)"
          docker logs --tail 60 bc2-game 2>&1 || true

          echo "=================== newest game server log (last 60 lines)"
          f=$(ls -t data/pack/Instance/RuntimeLog_* 2>/dev/null | head -1 || true)
          if [ -n "${f}" ]; then tail -n 60 "${f}"; else echo "(no RuntimeLog file)"; fi

          echo "=================== master database files"
          ls -la data/pack/MasterServerEmu/database || true
