# =============================================================================
# Test build of the BFBC2 game server image (version 2, with diagnostics).
#
# - Runs only when you click "Run workflow" in the Actions tab.
# - Nothing is published anywhere.
#
# What it does:
#   1. Builds the image (Wine + fake screen + Windows libraries).
#   2. Downloads, verifies and unpacks the server pack.
#   3. Starts TWO game servers at the same time, in two containers:
#        A: the pack's own Instance/       (RCON setting: bare port 48888)
#        B: the pack's own Instance_conq/  (RCON setting: 0.0.0.0:48889)
#      Two reasons: we compare the two RCON port formats, and it is a first
#      check that several servers can run side by side.
#   4. Prints lots of diagnostics, pass or fail.
#
# It does NOT start the master server yet. The servers will try to reach a
# master on 127.0.0.1 and keep retrying. That is expected for this test.
# =============================================================================
name: test-game-build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # SHA256 of Bc2emu_V09.rar (the server pack from SourceForge).
  PACK_SHA256: "d1b25860f23af15cbab6549d41840836056ab38a49357eb3064a7d00f6d9f04b"

jobs:
  game:
    # Native amd64 runner. Wine + the 32-bit game server are amd64 only.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out this repo
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # "load: true" keeps the image on the runner so we can test it.
      # "push: false" means it is NOT uploaded to any registry.
      # The cache makes repeat runs much faster (the Wine setup is slow).
      - name: Build the game image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: ./game
          load: true
          push: false
          tags: bfbc2-game:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Uses the image's own helper to download + verify + unpack the pack
      # into ./data/pack on the runner.
      - name: Fetch the server pack
        run: |
          mkdir -p data
          chmod 777 data
          docker run --rm --user 1000:1000 \
            -v "$PWD/data:/data" \
            -e PACK_SHA256="${PACK_SHA256}" \
            bfbc2-game:test fetch-pack
          ls -la data/pack | head -40

      # Same launch command as the original "Start ALL 8 Server.bat", for one
      # server, on Linux: Wine inside a fake screen (xvfb-run).
      # WINEDEBUG adds a trace of which Windows libraries get loaded. It shows
      # how far the program gets. Errors are printed too.
      #
      # "--init" matters: xvfb-run must NOT be the very first process (PID 1)
      # in the container. The fake screen only tells its parent "I am ready"
      # when that parent is not PID 1, so otherwise xvfb-run waits forever and
      # never starts the game. (That is what happened in test run 1 and 2.)
      # "--init" puts a tiny helper program in the PID 1 spot.
      - name: Start server A (Instance/, RCON bare port 48888)
        run: |
          docker run -d --init --name bc2-a --net=host --user 1000:1000 \
            -e WINEDEBUG=err+all,fixme-all,+loaddll \
            -v "$PWD/data:/data" -w /data/pack \
            bfbc2-game:test \
            xvfb-run -e /dev/stdout -a -s "-nolisten tcp -screen 0 1280x1024x24" \
            wine Frost.Game.Main_Win32_Final.exe \
              -serverInstancePath Instance/ \
              -mapPack2Enabled 1 \
              -timeStampLogNames \
              -region OC \
              -heartBeatInterval 20000

      # Give server B its own ports. Its RCON setting uses the "ip:port"
      # format (the format the community Docker image writes).
      # sudo is needed because the pack files belong to user 1000.
      - name: Prepare server B settings (Instance_conq/)
        run: |
          f=data/pack/Instance_conq/ServerOptions.ini
          echo "--------- before"; cat "$f"; echo
          sudo sed -i \
            -e 's/^Port=.*/Port=19568/' \
            -e 's/^RemoteAdminPort=.*/RemoteAdminPort=0.0.0.0:48889/' \
            "$f"
          echo "--------- after"; cat "$f"; echo

      - name: Start server B (Instance_conq/, RCON 0.0.0.0:48889)
        run: |
          docker run -d --init --name bc2-b --net=host --user 1000:1000 \
            -e WINEDEBUG=err+all,fixme-all,+loaddll \
            -v "$PWD/data:/data" -w /data/pack \
            bfbc2-game:test \
            xvfb-run -e /dev/stdout -a -s "-nolisten tcp -screen 0 1280x1024x24" \
            wine Frost.Game.Main_Win32_Final.exe \
              -serverInstancePath Instance_conq/ \
              -mapPack2Enabled 1 \
              -timeStampLogNames \
              -region OC \
              -heartBeatInterval 20000

      # Wait up to 90 seconds for either RCON port to open. When one opens,
      # wait 10 more seconds and report both.
      - name: Wait for the RCON ports
        run: |
          probe() { (echo > /dev/tcp/127.0.0.1/"$1") 2>/dev/null && echo yes || echo no; }
          for i in $(seq 1 45); do
            if [ "$(probe 48888)" = yes ] || [ "$(probe 48889)" = yes ]; then
              sleep 10
              echo "after about $((i*2+10)) seconds:"
              echo "  server A (bare port 48888):   open = $(probe 48888)"
              echo "  server B (0.0.0.0:48889):     open = $(probe 48889)"
              exit 0
            fi
            sleep 2
          done
          echo "Neither RCON port opened within 90 seconds"
          exit 1

      # Always print everything we can, pass or fail.
      - name: Diagnostics
        if: always()
        run: |
          for c in bc2-a bc2-b; do
            echo "=================== ${c}: state"
            docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' "${c}" || true
            echo "--------- processes inside ${c}"
            docker top "${c}" -eo pid,stat,pcpu,etime,args || true
            echo "--------- output of ${c} (last 150 lines)"
            docker logs --tail 150 "${c}" 2>&1 || true
          done
          echo "=================== listening ports on the runner"
          sudo ss -tulnp | head -40 || true
          echo "=================== files created or changed since unpacking"
          find data/pack -newer data/pack/.pack-sha256 -type f | head -50 || true
          for d in Instance Instance_conq; do
            echo "=================== newest server log in ${d}/ (last 60 lines)"
            f=$(ls -t data/pack/${d}/RuntimeLog_* 2>/dev/null | head -1 || true)
            if [ -n "${f}" ]; then tail -n 60 "${f}"; else echo "(no RuntimeLog file)"; fi
          done
