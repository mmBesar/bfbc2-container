# Test build of the BFBC2 master server emulator.
# Manual trigger only. Nothing is published.
name: test-master-build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SRC_SHA256: "a3e180526ac71af639e73c5ee33ea98c55ddae48d0e81aea2621070b0272031c"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this repo
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the master image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: ./master
          load: true
          push: false
          tags: bfbc2-master:test
          build-args: |
            SRC_SHA256=${{ env.SRC_SHA256 }}

      - name: Smoke test
        run: |
          # 1. Show which libraries the program links. Proves it loads.
          docker run --rm --entrypoint ldd bfbc2-master:test /opt/mase/mase_bc2
          # 2. Start it for a few seconds. It will probably complain about a
          #    missing config, and that is fine. We only want to see it run.
          timeout 10 docker run --name mase-smoke bfbc2-master:test || echo "exit code: $?"
          docker rm -f mase-smoke || true
