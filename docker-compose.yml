# =============================================================================
# BFBC2 all-in-one: docker-compose.yml
#
# This one file is all you need. Everything about the master server and every
# game server is set with the environment variables below. There are no other
# config files to edit.
#
# HOW TO USE
#   1. Change the two lines marked  <-- CHANGE ME (web password, RCON password).
#   2. Comment out (put a # in front of) any server you do not want.
#   3. docker compose up -d       then     docker compose logs -f
#
# The first start downloads the game server files once (about 440 MB).
# More detail for every variable: README.md
# =============================================================================
services:
  bfbc2:
    image: ghcr.io/mmbesar/bfbc2-container:latest
    # build: .                        # or build the image yourself from this repo
    container_name: bfbc2
    restart: unless-stopped
    network_mode: host                # required: port mapping breaks server registration
    logging:                          # stops "docker logs" from growing forever
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/data                  # everything is kept here. Back it up.
      # Own copy of the server pack? Put Bc2emu_V09.rar in ./data and use PACK_FILE below.

    environment:
      # ---- general ----------------------------------------------------------
      PUID: "1000"                    # user ID that owns the files in ./data (run: id -u)
      PGID: "1000"                    # group ID (run: id -g)
      TZ: "UTC"                       # time zone, for example Europe/Berlin
      # PACK_FILE: "/data/Bc2emu_V09.rar"   # use your own copy instead of downloading

      # ---- master server: accounts and the server list ----------------------
      # Any setting of the master's config.ini works as MASTER_<NAME>, upper case.
      # MASTER_EMULATOR_IP: "192.168.1.10"    # this machine's LAN IP. Found automatically if you leave it out.
                                              # Never use 0.0.0.0: clients then cannot log in.
      MASTER_ALL_STATS_UNLOCKED: "true"       # every weapon and gadget unlocked for new players
      MASTER_ALL_ARE_VETERAN: "true"          # everyone gets veteran rank items
      MASTER_PREMIUM_FOR_ALL: "true"          # everyone gets the premium edition items
      MASTER_VIETNAM_FOR_ALL: "true"          # everyone may join Vietnam servers
      MASTER_SPECACT_FOR_ALL: "false"         # everyone gets the SPECACT kits
      # MASTER_FILE_LOG_LEVEL: "3"            # master log detail: 1 (default, small) to 3 (HUGE, only to debug)
      # MASTER_LOG_TO_CONSOLE: "false"        # do not show the master log in "docker logs"
      # MASTER_ENABLED: "false"               # do not run a master here (use another one)
      # MASTER_HOST: "127.0.0.1"              # where the servers look for the master

      # ---- web interface: manage the servers in your browser ------------------
      # Open  http://<this machine's IP>:5010  and log in. It is plain HTTP: keep it on your LAN.
      WEB_PASSWORD: "ChangeMe123"             # <-- CHANGE ME (if left out, a random one is saved in ./data/config/web-password)
      # WEB_USER: "admin"                     # login name
      # WEB_PORT: "5010"                      # port
      # WEB_ENABLED: "false"                  # turn the web interface off

      # ---- defaults for EVERY game server -------------------------------------
      # Any SERVER_<NAME> here can be overridden for one server as SERVER_<n>_<NAME>.
      SERVER_RCON_PASSWORD: "ChangeMe123"     # <-- CHANGE ME: remote admin password. LETTERS AND DIGITS ONLY (no - or _ or spaces)
      # SERVER_RCON_BIND: "0.0.0.0"           # let other PCs use RCON (default: this machine only)
      SERVER_REGION: "OC"                     # region code shown to clients
      SERVER_RANKED: "true"                   # false = unranked. Needed for game passwords.
      SERVER_HARDCORE: "false"
      SERVER_FRIENDLY_FIRE: "false"
      SERVER_TEAM_BALANCE: "true"
      SERVER_KILLCAM: "true"
      SERVER_MINIMAP: "true"
      SERVER_CROSSHAIR: "true"
      SERVER_SPOTTING_3D: "true"
      SERVER_MINIMAP_SPOTTING: "true"

      # =======================================================================
      # GAME SERVERS  (Each one needs at least TYPE. Comment out what you don't want.)
      # Ports are automatic: game port 19567 + (n-1), RCON port 48888 + (n-1).
      # Each running server uses roughly 100-200 MB of RAM.
      # =======================================================================

      # ---- Bad Company 2 ------------------------------------------------------
      SERVER_1_TYPE: "rush"
      SERVER_1_NAME: "BFBC2 Rush"
      SERVER_1_MAX_PLAYERS: "32"

      SERVER_2_TYPE: "conq"
      SERVER_2_NAME: "BFBC2 Conquest"
      SERVER_2_MAX_PLAYERS: "32"

      SERVER_3_TYPE: "sqdm"
      SERVER_3_NAME: "BFBC2 Squad Deathmatch"
      SERVER_3_MAX_PLAYERS: "16"

      SERVER_4_TYPE: "sqrush"
      SERVER_4_NAME: "BFBC2 Squad Rush"
      SERVER_4_MAX_PLAYERS: "16"

      # ---- Vietnam ---------------------------------------------------------------
      SERVER_5_TYPE: "vietrush"
      SERVER_5_NAME: "BFBC2 Vietnam Rush"
      SERVER_5_MAX_PLAYERS: "32"

      SERVER_6_TYPE: "vietconq"
      SERVER_6_NAME: "BFBC2 Vietnam Conquest"
      SERVER_6_MAX_PLAYERS: "32"

      SERVER_7_TYPE: "vietsqdm"
      SERVER_7_NAME: "BFBC2 Vietnam Squad Deathmatch"
      SERVER_7_MAX_PLAYERS: "16"

      SERVER_8_TYPE: "vietsqrush"
      SERVER_8_NAME: "BFBC2 Vietnam Squad Rush"
      SERVER_8_MAX_PLAYERS: "16"

      # ---- more settings for any server (shown for server 1; use any number) ---------
      # SERVER_1_GAME_PASSWORD: "letmein"      # password to join (needs SERVER_1_RANKED: "false")
      # SERVER_1_RANKED: "false"
      # SERVER_1_DESCRIPTION: "Welcome!"       # server description
      # SERVER_1_MAPLIST: "mp_002, mp_004"     # your own map list (default: all maps of that mode)
      # SERVER_1_PORT: "19567"                 # game port (default shown)
      # SERVER_1_RCON_PORT: "48888"            # remote admin port (default shown)
      # SERVER_1_RCON_PASSWORD: "OtherPw123"   # own RCON password for this server (letters and digits only)
      # SERVER_1_BANNER_URL: "http://.../banner.png"   # server banner image (512x64 PNG)

      # ---- anything else -----------------------------------------------------------------
      # SERVER_1_OPT_<Key>: "value"            # any key of that server's ServerOptions.ini
      # SERVER_1_VAR_idleTimeout: "300"        # any "vars.<name>" startup setting
      # SERVER_1_STARTUP: "admin.say Hello"    # extra raw startup lines (one per line)
      # SERVER_1_EXTRA_ARGS: ""                # extra command line arguments for the server program

      # ---- gameplay options shared by ALL servers ------------------------------------------
      # HOOK_INSTANT_SPAWN: "0"
      # HOOK_UNLIMITED_AMMO: "0"
      # HOOK_HEALTH_MODE: "0"
      # HOOK_DESERTING_ALLOWED: "0"
      # HOOK_RANKING_MIN_PLAYERS: "1"
